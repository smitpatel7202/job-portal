<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs - Job Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <h2>💼 JobPortal</h2>
      </div>
      <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </div>
    </div>
  </nav>

  <!-- Jobs Section -->
  <section class="jobs-section">
    <div class="container">
      <div class="jobs-header">
        <h2>🔍 Browse All Jobs</h2>
      </div>

      <div id="alert" class="alert"></div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading jobs...</p>
      </div>

      <!-- Jobs Grid -->
      <div id="jobsGrid" class="jobs-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <h3>No Jobs Found</h3>
        <p>Check back later for new opportunities!</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 JobPortal. All rights reserved.</p>
      <p><a href="terms.html">Terms & Conditions</a> | <a href="privacy.html">Privacy Policy</a> | <a href="disclaimer.html">Disclaimer</a></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    let selectedJobForApply = null;

    // Fetch and display all jobs
    async function loadJobs() {
      const loading = document.getElementById('loading');
      const jobsGrid = document.getElementById('jobsGrid');
      const emptyState = document.getElementById('emptyState');

      try {
        const data = await apiRequest('/jobs');
        
        // Debug: Log user status
        console.log('User logged in:', isLoggedIn());
        console.log('User data:', getUser());
        console.log('Jobs data received:', data);
        
        // Handle case where data is null or not an array
        if (!data || !Array.isArray(data)) {
          console.error('Invalid jobs data received:', data);
          loading.style.display = 'none';
          emptyState.style.display = 'block';
          return;
        }
        
        // Get user's applications to check if already applied
        let userApplications = [];
        if (isLoggedIn() && getUser() && getUser().role === 'jobseeker') {
          try {
            userApplications = await apiRequest('/applications/my');
            console.log('User applications:', userApplications);
          } catch (error) {
            console.error('Failed to load applications:', error);
          }
        }
        
        const appliedJobIds = new Set(userApplications.map(app => {
          if (!app || !app.jobId) {
            console.error('Invalid application object or missing jobId:', app);
            return null;
          }
          return app.jobId._id;
        }).filter(id => id !== null));
        
        loading.style.display = 'none';

        if (data.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        jobsGrid.innerHTML = data.map(job => {
          if (!job || !job._id) {
            console.error('Invalid job object or missing _id:', job);
            return ''; // Skip this job or handle appropriately
          }
          const hasApplied = appliedJobIds.has(job._id);
          
          // Debug: Log job and application status
          console.log(`Job: ${job.title}, Has Applied: ${hasApplied}`);
          
          // Get experience level display with emoji and years
          const getExperienceDisplay = (level) => {
            switch(level) {
              case 'Entry':
                return '🟢 Entry-Level (0-1 Yrs)';
              case 'Mid':
                return '🔵 Mid-Level (1-3 Yrs)';
              case 'Senior':
                return '🟡 Experienced (3+ Yrs)';
              case 'Lead':
                return '🔴 Lead/Manager';
              default:
                return '⚪ Not Specified';
            }
          };
          
          return `
          <div class="job-card">
            <div class="job-header">
              <div>
                <h3 class="job-title" style="cursor: pointer;" onclick="viewJobDetails('${job._id}')">${job.title || 'Job Title Not Available'}</h3>
                <span class="job-type">${job.type || 'Not Specified'}</span>
              </div>
            </div>
            <div class="experience-tag" data-level="${job.experienceLevel}" style="margin: 8px 0; font-weight: bold; color: #2c3e50;">
              ${getExperienceDisplay(job.experienceLevel)}
            </div>
            <p class="job-company">
              🏢 ${job.company || 'Company Not Available'}
              ${job.postedBy && job.postedBy.isVerified ? '<span class="verified-badge">✓ Verified</span>' : ''}
            </p>
            <p class="job-location">📍 ${job.location || 'Location Not Available'}</p>
            <p class="job-description">${(job.description || 'No description available').substring(0, 150)}...</p>
            <div class="job-footer">
              <span class="job-salary">${job.salary || 'Salary not disclosed'}</span>
              <div>
                <button class="btn btn-info btn-small" onclick="viewJobDetails('${job._id}')" style="margin-right: 5px;">
                  View Details
                </button>
                ${isLoggedIn() && getUser() && getUser().role === 'jobseeker' ? `
                  ${hasApplied ? `
                    <button class="btn btn-secondary btn-small" disabled>
                      Applied ✓
                    </button>
                  ` : `
                    <button class="btn btn-primary btn-small" onclick="openChallengeModal('${job._id}')">
                      Apply Now
                    </button>
                  `}
                ` : ''}
                ${!isLoggedIn() ? `
                  <button class="btn btn-primary btn-small" onclick="showLoginPrompt()">
                    Login to Apply
                  </button>
                ` : ''}
                ${isLoggedIn() && getUser() && getUser().role !== 'jobseeker' ? `
                  <button class="btn btn-secondary btn-small" disabled>
                    Only for Job Seekers
                  </button>
                ` : ''}
                ${isLoggedIn() ? `
                  <button class="btn btn-secondary btn-small" onclick="reportJob('${job._id}')" style="margin-left: 5px;">
                    Report
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        }).join('');

      } catch (error) {
        loading.style.display = 'none';
        showAlert('Failed to load jobs: ' + error.message, 'error');
      }
    }

    // View job details
    function viewJobDetails(jobId) {
      window.open(`job-details.html?id=${jobId}`, '_blank');
    }

    async function openChallengeModal(jobId) {
      selectedJobForApply = jobId;
      const existingModal = document.getElementById('challengeModal');
      if (!existingModal) {
        createChallengeModal();
      }
      const modal = document.getElementById('challengeModal');
      const questionEl = document.getElementById('challengeQuestionText');
      const textarea = document.getElementById('challengeAnswer');

      try {
        const job = await apiRequest(`/jobs/${jobId}`);
        const challengeQuestion = job.challengeQuestion;
        if (challengeQuestion && challengeQuestion.trim()) {
          questionEl.textContent = `Employer's Task: ${challengeQuestion}`;
        } else {
          questionEl.textContent = "Task: Briefly explain why you are a strong fit for this role, and share any relevant links (GitHub, portfolio, etc.).";
        }
      } catch (error) {
        showAlert('Failed to load the employer task: ' + error.message, 'error');
        return;
      }
      textarea.value = '';
      updateChallengeSubmitState();
      modal.style.display = 'block';
    }

    function closeChallengeModal() {
      const modal = document.getElementById('challengeModal');
      if (modal) modal.style.display = 'none';
    }

    function createChallengeModal() {
      const modalHtml = `
        <div id="challengeModal" class="modal-overlay">
          <div class="modal-content" style="max-width: 600px;">
            <h3>Application Task</h3>
            <p id="challengeQuestionText" style="margin-bottom: 1rem;"></p>
            <textarea id="challengeAnswer" rows="6" class="form-control" oninput="updateChallengeSubmitState()" placeholder="Type your detailed answer or paste relevant links here..." style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #ccc;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
              <button class="btn btn-secondary btn-small" type="button" onclick="closeChallengeModal()">Cancel</button>
              <button id="challengeSubmitBtn" class="btn btn-primary btn-small" type="button" onclick="submitApplicationWithChallenge()" disabled>Submit Application</button>
            </div>
          </div>
        </div>
      `;
      const container = document.createElement('div');
      container.innerHTML = modalHtml;
      document.body.appendChild(container.firstElementChild);
    }

    function updateChallengeSubmitState() {
      const textarea = document.getElementById('challengeAnswer');
      const submitBtn = document.getElementById('challengeSubmitBtn');
      if (!textarea || !submitBtn) return;
      submitBtn.disabled = !textarea.value.trim();
    }

    // Final submit with challenge
    async function submitApplicationWithChallenge() {
      if (!selectedJobForApply) {
        showAlert('No job selected for application', 'error');
        return;
      }

      const answer = document.getElementById('challengeAnswer').value.trim();

      if (!answer) {
        showAlert('Please complete the mandatory screening task before submitting.', 'error');
        return;
      }

      if (!isLoggedIn()) {
        showAlert('Please login to apply for jobs', 'error');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
        return;
      }

      const user = getUser();
      if (user.role !== 'jobseeker') {
        showAlert('Only job seekers can apply to jobs', 'error');
        return;
      }

      try {
        const data = await apiRequest('/applications', {
          method: 'POST',
          body: JSON.stringify({ jobId: selectedJobForApply, challengeSubmission: answer }),
        });

        showAlert(data.message, 'success');
        closeChallengeModal();
        
        // Update the apply button to show applied status
        const applyButton = document.querySelector(`button[onclick="openChallengeModal('${selectedJobForApply}')"]`);
        if (applyButton) {
          applyButton.disabled = true;
          applyButton.textContent = 'Applied ✓';
          applyButton.classList.remove('btn-primary');
          applyButton.classList.add('btn-secondary');
          applyButton.onclick = null; // Remove click handler
        }
        
        // Reload jobs to update all button states
        setTimeout(() => loadJobs(), 1000);
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    // Show login prompt
    function showLoginPrompt() {
      showAlert('Please login to apply for jobs. Redirecting to login page...', 'info');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    }

    // Load jobs on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadJobs();
    });
  </script>
</body>
</html>
